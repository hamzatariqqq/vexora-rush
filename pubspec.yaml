name: vexora_rush
description: "Vexora Rush - Endless neon arcade survival game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: 1.38.2
  shared_preferences: 2.5.5
  google_mobile_ads: 9.1.0
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#020611"
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#020611"
    image: assets/images/splash_transparent.png